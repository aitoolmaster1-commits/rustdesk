<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background / Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="35%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>

    <!-- Top Orange-Red Wing Gradient -->
    <linearGradient id="topOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3838" />
      <stop offset="45%" stop-color="#ff6b35" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>

    <!-- Mid Purple Wing Gradient -->
    <linearGradient id="midPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0072" />
      <stop offset="40%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Subtle Shadow overlay -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Rocket Window Gradient -->
    <radialGradient id="windowGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="40%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#005f73" />
    </radialGradient>
  </defs>

  <!-- Main Letter F Structure -->
  <g id="letter-f-base">
    <!-- Blue Stem and Body -->
    <path d="M 120,40 
             C 95,40 75,60 75,85 
             L 75,435 
             C 75,460 95,475 120,475 
             C 145,475 165,460 165,435 
             L 165,260 
             L 300,260 
             C 335,260 365,245 365,215 
             C 365,185 335,170 300,170 
             L 165,170 
             L 165,40 
             Z" 
          fill="url(#stemGrad)" />

    <!-- Top Horizontal Bar (Orange) -->
    <path d="M 165,40 
             L 380,40 
             C 415,40 445,65 445,95 
             C 445,125 415,145 380,145 
             L 165,145 
             Z" 
          fill="url(#topOrangeGrad)" />

    <!-- Middle Horizontal Bar (Purple Wing) -->
    <path d="M 165,260 
             L 310,260 
             C 345,260 365,275 365,295 
             C 365,325 335,345 295,345 
             C 240,345 190,315 165,260 
             Z" 
          fill="url(#midPurpleGrad)" />

    <!-- Middle Bar Drop Shadow -->
    <path d="M 165,260 
             C 195,295 240,315 295,315 
             C 325,315 350,305 360,295 
             C 345,270 310,260 280,260 
             Z" 
          fill="url(#innerShadow)" />
  </g>

  <!-- Rocket & Smoke Exhaust Cutout in Negative Space (White) -->
  <g id="rocket-and-trail" fill="#ffffff">
    <!-- Exhaust Plume / Trail -->
    <path d="M 120,230 
             L 125,385 
             C 125,405 115,415 115,430 
             C 115,445 125,455 125,475 
             L 105,475 
             C 105,455 115,445 115,430 
             C 115,415 105,405 105,385 
             L 110,230 
             Z" />

    <path d="M 110,340 
             C 100,340 92,350 92,365 
             C 92,378 100,388 110,390 
             L 110,340 Z" />
             
    <path d="M 125,370 
             C 135,370 142,380 142,392 
             C 142,404 135,412 125,415 
             L 125,370 Z" />

    <!-- Circuit Nodes on Trail Base -->
    <circle cx="95" cy="425" r="4" fill="#ffffff" />
    <circle cx="140" cy="445" r="4" fill="#ffffff" />
    <line x1="95" y1="425" x2="105" y2="425" stroke="#ffffff" stroke-width="2" />
    <line x1="130" y1="445" x2="140" y2="445" stroke="#ffffff" stroke-width="2" />

    <!-- Rocket Body -->
    <path d="M 117.5,100 
             C 117.5,100 135,135 135,180 
             L 135,215 
             L 100,215 
             L 100,180 
             C 100,135 117.5,100 117.5,100 Z" />

    <!-- Left Rocket Fin -->
    <path d="M 100,185 
             L 85,210 
             C 83,222 93,225 100,225 
             L 100,185 Z" />

    <!-- Right Rocket Fin -->
    <path d="M 135,185 
             L 150,210 
             C 152,222 142,225 135,225 
             L 135,185 Z" />

    <!-- Rocket Window Outer Ring -->
    <circle cx="117.5" cy="155" r="14" fill="#ffffff" />
  </g>

  <!-- Rocket Needle / Antenna -->
  <line x1="117.5" y1="82" x2="117.5" y2="102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="117.5" cy="80" r="2.5" fill="#ffffff" />

  <!-- Rocket Window Inner -->
  <circle cx="117.5" cy="155" r="10" fill="url(#windowGrad)" />

  <!-- Typography: Firmware World -->
  <text x="290" y="420" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="0.5"
        fill="#3f0071" 
        text-anchor="middle">Firmware</text>

  <text x="290" y="458" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="32" 
        font-weight="900" 
        letter-spacing="0.5"
        fill="#3f0071" 
        text-anchor="middle">World</text>
</svg>
