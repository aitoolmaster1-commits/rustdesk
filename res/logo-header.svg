<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&amp;family=Montserrat:wght@800;900&amp;display=swap');

      .text-firmware {
        font-family: 'Poppins', 'Montserrat', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        font-size: 132px;
        letter-spacing: -2px;
      }

      .text-world {
        font-family: 'Poppins', 'Montserrat', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        font-size: 132px;
        letter-spacing: -3px;
        fill: url(#world-grad);
      }

      .sub-text {
        font-family: 'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        font-size: 21.5px;
        letter-spacing: 5.5px;
        fill: #0d0e11;
      }
    </style>

    <!-- World Gradient -->
    <linearGradient id="world-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F57E20"/>
      <stop offset="45%" stop-color="#F15A24"/>
      <stop offset="100%" stop-color="#DE2026"/>
    </linearGradient>

    <!-- Swoop Gradient -->
    <linearGradient id="swoop-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="100%" stop-color="#F15A24"/>
    </linearGradient>

    <!-- Dynamic Flow Gradients for "Firmware" -->
    <linearGradient id="flow-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF"/>
      <stop offset="50%" stop-color="#0080A3"/>
      <stop offset="100%" stop-color="#00465E"/>
    </linearGradient>

    <linearGradient id="flow-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005A70"/>
      <stop offset="60%" stop-color="#00A8C6"/>
      <stop offset="100%" stop-color="#4BE3AC"/>
    </linearGradient>

    <linearGradient id="flow-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581D76"/>
      <stop offset="50%" stop-color="#7B2382"/>
      <stop offset="100%" stop-color="#2D114D"/>
    </linearGradient>

    <linearGradient id="flow-orange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9381E"/>
      <stop offset="50%" stop-color="#F15A24"/>
      <stop offset="100%" stop-color="#FBB03B"/>
    </linearGradient>

    <!-- Text Clip Mask for "Firmware" -->
    <clipPath id="firmware-clip">
      <text x="10" y="132" class="text-firmware">Firmware</text>
    </clipPath>
  </defs>

  <!-- "Firmware" Multi-Tone Gradient Wave Artwork -->
  <g clip-path="url(#firmware-clip)">
    <!-- Base Color Underlay -->
    <rect x="0" y="0" width="560" height="160" fill="#00799E"/>

    <!-- Wave 1: Deep Cyan / Blue Swirl (Covers F & I) -->
    <path d="M-20,-10 C80,40 20,120 15,170 L160,170 C160,110 90,40 180,-10 Z" fill="url(#flow-cyan)"/>
    <path d="M-10,60 C40,40 100,100 40,160 C0,130 10,90 -10,60 Z" fill="#00526B" opacity="0.75"/>

    <!-- Wave 2: Purple & Violet Ribbons (Covers r & m left) -->
    <path d="M90,170 C130,120 100,40 150,-10 L230,-10 C190,40 210,110 160,170 Z" fill="url(#flow-purple)"/>
    <path d="M120,80 C150,50 170,80 180,160 C155,160 135,130 120,80 Z" fill="url(#flow-orange)"/>

    <!-- Wave 3: Teal & Cyan Mid Ribbons (Covers m right & w) -->
    <path d="M190,-10 C260,30 210,120 280,170 L350,170 C310,120 330,40 280,-10 Z" fill="url(#flow-teal)"/>
    <path d="M250,30 C270,80 290,120 340,90 C320,50 290,30 250,30 Z" fill="url(#flow-cyan)" opacity="0.9"/>

    <!-- Wave 4: Magenta & Orange Fold (Covers a & r) -->
    <path d="M320,170 C370,110 350,30 420,-10 L480,-10 C430,40 450,120 390,170 Z" fill="url(#flow-purple)"/>
    <path d="M375,60 C390,30 435,50 430,120 C400,110 380,85 375,60 Z" fill="url(#flow-orange)"/>

    <!-- Wave 5: Cyan & Aquamarine Terminal (Covers e) -->
    <path d="M440,-10 C510,30 470,110 530,170 L580,170 C560,90 560,20 510,-10 Z" fill="url(#flow-teal)"/>
    <path d="M470,80 C500,40 550,60 550,140 C520,130 490,120 470,80 Z" fill="url(#flow-cyan)"/>
  </g>

  <!-- "World" Text -->
  <text x="548" y="132" class="text-world">World</text>

  <!-- Smile Swoop Under "ware" -->
  <path d="M282,138 C332,176 392,176 438,138 C443,134 449,139 444,146 C394,188 326,188 276,146 C271,139 277,134 282,138 Z" fill="url(#swoop-grad)"/>

  <!-- Subtitle: "PREMIUM FIRMWARE SERVER" -->
  <text x="444" y="166" class="sub-text">PREMIUM FIRMWARE SERVER</text>
</svg>
