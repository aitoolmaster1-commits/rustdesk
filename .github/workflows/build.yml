name: Build RustDesk Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: 'C:\vcpkg'
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Normalize Directory Structure
        shell: pwsh
        run: |
          if (Test-Path "rustdesk-master") {
              Write-Host "Moving files from rustdesk-master to root directory..."
              Get-ChildItem -Path "rustdesk-master" | ForEach-Object {
                  Move-Item -Path $_.FullName -Destination "." -Force
              }
              Remove-Item -Path "rustdesk-master" -Recurse -Force
          }

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Setup LLVM & Ninja
        run: |
          choco install llvm ninja -y

      - name: Install vcpkg Dependencies
        shell: pwsh
        run: |
          cd C:\vcpkg
          .\vcpkg.exe integrate install
          .\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libs/portable/requirements.txt || true

      - name: Build Rust Core & Flutter Windows
        shell: pwsh
        run: |
          # 1. Fetch Flutter packages
          cd flutter
          flutter pub get
          cd ..

          # 2. Build via RustDesk build script
          if (Test-Path "build.py") {
              python build.py --flutter
          } else {
              cargo build --release --features flutter
              cd flutter
              flutter build windows --release
          }

      - name: Collect Build Output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          
          if (Test-Path "flutter/build/windows/x64/runner/Release") {
              Copy-Item -Path "flutter/build/windows/x64/runner/Release/*" -Destination "dist" -Recurse -Force
          } elseif (Test-Path "flutter/build/windows/runner/Release") {
              Copy-Item -Path "flutter/build/windows/runner/Release/*" -Destination "dist" -Recurse -Force
          }
          
          if (Test-Path "target/release/*.exe") {
              Copy-Item -Path "target/release/*.exe" -Destination "dist" -Force
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Windows-x64
          path: dist/
