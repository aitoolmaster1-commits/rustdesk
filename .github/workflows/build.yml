name: Auto Clone and Build RustDesk EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: 'C:\vcpkg'
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

    steps:
      # ১. সরাসরি অফিশিয়াল RustDesk রিপোজিটরি ক্লোন করা হবে (আপনার নেট খরচ হবে না)
      - name: Clone Official RustDesk Source Code
        run: |
          git clone --recurse-submodules https://github.com/rustdesk/rustdesk.git .

      # ২. আপনার নিজের রিপোজিটরির কোনো কাস্টম ফাইল/প্যাচ থাকলে তা আনার জন্য
      - name: Checkout Your Repository Custom Code
        uses: actions/checkout@v4
        with:
          path: 'custom_patch'

      # ৩. যদি আপনার কাস্টম কোনো ফাইল থাকে, তা স্বয়ংক্রিয়ভাবে রিপ্লেস করা
      - name: Apply Custom Files (If any)
        shell: pwsh
        run: |
          if (Test-Path "custom_patch") {
              Write-Host "Applying custom files from your repository..."
              Get-ChildItem -Path "custom_patch" -Exclude ".git", ".github", "custom_patch" | ForEach-Object {
                  Copy-Item -Path $_.FullName -Destination "." -Recurse -Force
              }
              Remove-Item -Path "custom_patch" -Recurse -Force
          }

      # ৪. Rust এনভায়রনমেন্ট সেটআপ
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ৫. Python সেটআপ
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ৬. Flutter SDK সেটআপ
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      # ৭. LLVM, Clang ও Ninja টুলস
      - name: Setup LLVM & Ninja
        run: |
          choco install llvm ninja -y

      # ৮. প্রয়োজনীয় vcpkg অডিও/ভিডিও ডিপেন্ডেন্সি
      - name: Install vcpkg Dependencies
        shell: pwsh
        run: |
          cd C:\vcpkg
          .\vcpkg.exe integrate install
          .\vcpkg.exe install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r libs/portable/requirements.txt || true

      # ৯. RustDesk এবং Flutter বিল্ড রান করা
      - name: Build Rust Core & Flutter Windows
        shell: pwsh
        run: |
          cd flutter
          flutter pub get
          cd ..

          if (Test-Path "build.py") {
              python build.py --flutter
          } else {
              cargo build --release --features flutter
              cd flutter
              flutter build windows --release
          }

      # ১০. আউটপুট EXE সংগ্রহ করা
      - name: Collect Build Output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          
          if (Test-Path "flutter/build/windows/x64/runner/Release") {
              Copy-Item -Path "flutter/build/windows/x64/runner/Release/*" -Destination "dist" -Recurse -Force
          } elseif (Test-Path "flutter/build/windows/runner/Release") {
              Copy-Item -Path "flutter/build/windows/runner/Release/*" -Destination "dist" -Recurse -Force
          }
          
          if (Test-Path "target/release/*.exe") {
              Copy-Item -Path "target/release/*.exe" -Destination "dist" -Force
          }

      # ১১. ডাউনলোড করার জন্য আপলোড করা
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Windows-x64
          path: dist/
